[project]
name = "acis-x"
version = "1.1.0"
description = "Autonomous Credit Intelligence System — Multi-agent event-driven credit risk platform"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Kafka
    "confluent-kafka==2.3.0",

    # Data validation
    "pydantic>=2.12,<3",

    # Configuration
    "python-dotenv>=1.2,<2",

    # System metrics
    "psutil>=5.9,<6",

    # Web scraping (ExternalDataAgent / ExternalScrapingAgent)
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.2,<6",
    "requests>=2.32,<3",

    # ML (PaymentPredictionAgent)
    "numpy>=1.26,<2",
    "scikit-learn>=1.4,<2",
    "shap>=0.45,<1",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8",
    "pytest-cov>=4.1,<5",
    "pytest-mock>=3.12,<4",
    "pytest-asyncio>=0.21,<1",
    "httpx>=0.28,<1",
    "ruff>=0.5",
    "mypy>=1.10",
]

bff = [
    "fastapi>=0.135,<1",
    "uvicorn>=0.42,<1",
    "aiokafka>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length handled separately

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
