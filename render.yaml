services:
  # ── 1. Frontend Web App (100% Free Static Site) ─────────────────────────
  - type: web
    name: acis-frontend
    runtime: static
    buildCommand: cd acis-x-frontend && npm ci && npm run build
    staticPublishPath: ./acis-x-frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://acis-backend.onrender.com

  # ── 2. Unified Backend Web Service (Kafka + Engine + BFF All-In-One) ────
  - type: web
    name: acis-backend
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile.prod
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ACIS_API_KEY
        generateValue: true
      - key: ACIS_ENV
        value: production
      - key: ACIS_DB_PATH
        value: /app/data/acis.db
      - key: ACIS_KAFKA_BOOTSTRAP_SERVERS
        value: localhost:9092
      - key: ACIS_KAFKA_BACKEND
        value: kafka-python
      - key: ACIS_ALLOWED_ORIGINS
        value: "*"
